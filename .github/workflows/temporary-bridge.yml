name: Temporary bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bridge code
        run: node --check standalone-server.mjs
      - name: Download cloudflared
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version
      - name: Start authenticated bridge
        env:
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          BIND_HOST: 127.0.0.1
          PORT: '8080'
        run: |
          set -euo pipefail
          if [ "${#BRIDGE_KEY}" -lt 16 ]; then
            echo 'Repository BRIDGE_KEY secret is missing or too short.' >&2
            exit 1
          fi
          nohup node standalone-server.mjs > bridge.log 2>&1 < /dev/null &
          server_pid=$!
          unset BRIDGE_KEY
          trap 'kill ${tunnel_pid:-} "$server_pid" 2>/dev/null || true' ERR
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then echo 'Bridge stopped.' >&2; exit 1; fi
            sleep 1
          done
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > tunnel.log 2>&1 < /dev/null &
          tunnel_pid=$!
          tunnel_url=''
          for i in $(seq 1 90); do
            tunnel_url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$tunnel_url" ]; then break; fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then echo 'Tunnel stopped.' >&2; exit 1; fi
            sleep 2
          done
          if [ -z "$tunnel_url" ]; then echo 'Tunnel URL was not issued.' >&2; exit 1; fi
          tunnel_ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 8 "$tunnel_url/healthz" > /dev/null; then
              tunnel_ready=true
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$tunnel_ready" != true ]; then
            echo 'Public tunnel health check failed.' >&2
            exit 1
          fi
          printf '%s %s\n' "$server_pid" "$tunnel_pid" > "$RUNNER_TEMP/bridge-pids"
          printf '%s\n' "$tunnel_url/api/bridge" > "$RUNNER_TEMP/bridge-url.txt"
          echo "Bridge URL: $tunnel_url/api/bridge"
          echo "::notice title=Temporary bridge URL::$tunnel_url/api/bridge"
          echo "Bridge URL: $tunnel_url/api/bridge" >> "$GITHUB_STEP_SUMMARY"
          echo 'The URL is temporary. The key is never printed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-url
          path: ${{ runner.temp }}/bridge-url.txt
          retention-days: 1
      - name: Publish public current address
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bridge_url=$(cat "$RUNNER_TEMP/bridge-url.txt")
          endpoint="https://api.github.com/repos/$GH_REPOSITORY/contents/status/current.json"
          existing=$(curl --silent --show-error -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H 'Accept: application/vnd.github+json' "$endpoint")
          sha=$(jq -r '.sha // empty' <<< "$existing")
          encoded=$(jq -r '.content // empty' <<< "$existing")
          previous_json='null'
          if [ -n "$encoded" ]; then
            decoded=$(printf '%s' "$encoded" | base64 --decode)
            previous_run=$(jq -r '.run_id // 0' <<< "$decoded")
            if [[ "$previous_run" =~ ^[0-9]+$ ]] && (( previous_run > GH_RUN_ID )); then
              echo 'A newer run already published its address.'
              exit 0
            fi
            if [[ "$previous_run" =~ ^[0-9]+$ ]] && (( previous_run < GH_RUN_ID )); then
              previous_json=$(jq -c '{bridge_url,run_id}' <<< "$decoded")
            elif [[ "$previous_run" =~ ^[0-9]+$ ]] && (( previous_run == GH_RUN_ID )); then
              previous_json=$(jq -c '.previous // null' <<< "$decoded")
            fi
          fi
          content=$(jq -nc --arg bridge_url "$bridge_url" --argjson run_id "$GH_RUN_ID" \
            --argjson previous "$previous_json" \
            '{bridge_url:$bridge_url,run_id:$run_id} + (if $previous == null then {} else {previous:$previous} end)' | base64 -w 0)
          payload=$(jq -nc --arg content "$content" --arg sha "$sha" \
            '{message:"Update temporary bridge address",content:$content} + (if $sha == "" then {} else {sha:$sha} end)')
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            --data "$payload" "$endpoint" > /dev/null
      - name: Keep bridge online
        run: |
          set -euo pipefail
          read -r server_pid tunnel_pid < "$RUNNER_TEMP/bridge-pids"
          trap 'kill "$tunnel_pid" "$server_pid" 2>/dev/null || true' EXIT
          while kill -0 "$server_pid" 2>/dev/null && kill -0 "$tunnel_pid" 2>/dev/null; do sleep 5; done
          echo 'Bridge or tunnel stopped.' >&2
          exit 1

